<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ApexTeen5</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f6f7f8;max-width:480px;margin:0 auto;padding-bottom:90px}
.header{position:sticky;top:0;background:#fff;z-index:20;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee}
.btn{padding:10px 14px;border-radius:10px;border:1px solid #ddd;background:#fff;font-weight:700;cursor:pointer}
.btn.p{background:#f65858;color:#fff;border-color:#f65858;width:100%;margin-top:10px;padding:14px}
.card{background:#fff;margin:12px 16px;border-radius:12px;overflow:hidden;border:1px solid #eee}
.card img{width:100%;height:180px;object-fit:cover}
.filters{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:#fff}
.chip{padding:8px 16px;border-radius:20px;border:1px solid #ddd;background:#fff;cursor:pointer;white-space:nowrap}
.chip.a{background:#f65858;color:#fff}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:10px 0;z-index:30}
.nav{font-size:11px;text-align:center;color:#999;cursor:pointer;padding:6px 14px;border-radius:12px}
.nav.a{color:#f65858;background:#fff1f1}
.plus{width:54px;height:54px;background:#f65858;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;margin-top:-28px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;justify-content:center;align-items:flex-end}
.modal.o{display:flex}
.box{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px;max-height:92vh;overflow-y:auto}
input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:8px 0}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;z-index:99;display:none}
</style>
</head>
<body>
<div class="header"><b style="color:#f65858">ApexTeen5 🌍</b><button id="lb" class="btn p" style="width:auto;padding:8px 12px" onclick="login()">Login</button></div>

<div style="padding:12px 16px;background:#fff">
<input id="s" placeholder="🔍 Search title..." oninput="show()">
<select id="cFilter" onchange="show()" style="margin-top:8px">
<option value="all">🌍 All Countries (195)</option>
<option>Afghanistan</option><option>Albania</option><option>Algeria</option><option>Andorra</option><option>Angola</option><option>Argentina</option><option>Armenia</option><option>Australia</option><option>Austria</option><option>Azerbaijan</option><option>Bahamas</option><option>Bahrain</option><option>Bangladesh</option><option>Barbados</option><option>Belarus</option><option>Belgium</option><option>Belize</option><option>Benin</option><option>Bhutan</option><option>Bolivia</option><option>Bosnia</option><option>Botswana</option><option>Brazil</option><option>Brunei</option><option>Bulgaria</option><option>Burkina Faso</option><option>Burundi</option><option>Cambodia</option><option>Cameroon</option><option>Canada</option><option>Chad</option><option>Chile</option><option>China</option><option>Colombia</option><option>Congo</option><option>Costa Rica</option><option>Croatia</option><option>Cuba</option><option>Cyprus</option><option>Czech</option><option>Denmark</option><option>Dominican Republic</option><option>Ecuador</option><option>Egypt</option><option>El Salvador</option><option>Estonia</option><option>Ethiopia</option><option>Fiji</option><option>Finland</option><option>France</option><option>Gabon</option><option>Gambia</option><option>Georgia</option><option>Germany</option><option>Ghana</option><option>Greece</option><option>Guatemala</option><option>Guinea</option><option>Guyana</option><option>Haiti</option><option>Honduras</option><option>Hungary</option><option>Iceland</option><option>India</option><option>Indonesia</option><option>Iran</option><option>Iraq</option><option>Ireland</option><option>Israel</option><option>Italy</option><option>Jamaica</option><option>Japan</option><option>Jordan</option><option>Kazakhstan</option><option>Kenya</option><option>Korea South</option><option>Kuwait</option><option>Kyrgyzstan</option><option>Laos</option><option>Latvia</option><option>Lebanon</option><option>Libya</option><option>Lithuania</option><option>Luxembourg</option><option>Madagascar</option><option>Malaysia</option><option>Maldives</option><option>Mali</option><option>Malta</option><option>Mexico</option><option>Moldova</option><option>Monaco</option><option>Mongolia</option><option>Morocco</option><option>Mozambique</option><option>Myanmar</option><option>Namibia</option><option>Nepal</option><option>Netherlands</option><option>New Zealand</option><option>Nicaragua</option><option>Niger</option><option>Nigeria</option><option>Norway</option><option>Oman</option><option>Pakistan</option><option>Palestine</option><option>Panama</option><option>Paraguay</option><option>Peru</option><option>Philippines</option><option>Poland</option><option>Portugal</option><option>Qatar</option><option>Romania</option><option>Russia</option><option>Rwanda</option><option>Saudi Arabia</option><option>Senegal</option><option>Serbia</option><option>Singapore</option><option>Slovakia</option><option>Slovenia</option><option>Somalia</option><option>South Africa</option><option>Spain</option><option>Sri Lanka</option><option>Sudan</option><option>Sweden</option><option>Switzerland</option><option>Syria</option><option>Taiwan</option><option>Tajikistan</option><option>Tanzania</option><option>Thailand</option><option>Togo</option><option>Trinidad</option><option>Tunisia</option><option>Turkey</option><option>Turkmenistan</option><option>Uganda</option><option>Ukraine</option><option>UAE</option><option>UK</option><option>USA</option><option>Uruguay</option><option>Uzbekistan</option><option>Venezuela</option><option>Vietnam</option><option>Yemen</option><option>Zambia</option><option>Zimbabwe</option>
</select>
<input id="aFilter" placeholder="📍 State/City - Bela, UP, Delhi, California likho" oninput="show()" style="margin-top:6px">
</div>

<div class="filters" id="fb"></div>
<div id="feed"></div>

<div class="bottom">
<div class="nav a" onclick="home()"><div>🏠</div>Home</div>
<div class="nav" onclick="openEx()"><div>🧭</div>Explore</div>
<div class="nav" onclick="openC()"><div class="plus">+</div>Idea</div>
<div class="nav" onclick="openDM()"><div>💬</div>DM</div>
<div class="nav" onclick="openP()"><div>👤</div>Profile</div>
</div>

<div id="cM" class="modal" onclick="if(event.target==this)closeC()"><div class="box">
<h3 id="cT">Post Idea</h3><input id="cTitle" placeholder="Title *"><textarea id="cDesc" placeholder="Describe *"></textarea><select id="cCat"><option>Tech</option><option>AI</option><option>Coding</option><option>Study</option><option>Startup</option></select><input id="cLoc" placeholder="City/State - ex: Bela"><input type="file" id="cFile" multiple accept="image/*"><div id="cPrev" style="display:flex;gap:6px;overflow-x:auto"></div><button class="btn p" id="cBtn" onclick="save()">Post</button>
</div></div>

<div id="dM" class="modal" style="align-items:flex-start"><div style="background:#fff;width:100%;max-width:480px;height:100vh;overflow:auto">
<div style="padding:12px;display:flex;justify-content:space-between;border-bottom:1px solid #eee"><b id="dCat"></b><span onclick="closeD()" style="font-size:22px;cursor:pointer">✕</span></div>
<div id="dGal" style="display:flex;gap:6px;padding:10px;overflow:auto"></div><img id="dBan" style="width:100%;height:220px;object-fit:cover;display:none">
<div style="padding:16px"><h2 id="dTT"></h2><div id="dOwn" style="font-size:13px;color:#666;margin:6px 0"></div><p id="dDes" style="margin-top:8px"></p>
<div style="display:flex;gap:6px;margin-top:12px"><button class="btn p" id="dJoin" onclick="join()" style="flex:1">Support</button><button class="btn" onclick="doDM()">💬 DM</button><button class="btn" onclick="doRep()">🚩 Report</button></div>
<div style="display:flex;gap:6px;margin-top:8px"><button class="btn" id="dEdit" style="flex:1;display:none" onclick="doEdit()">Edit</button><button class="btn" id="dDel" style="flex:1;display:none;color:red" onclick="doDel()">Delete</button></div>
<div style="margin-top:16px"><b>Comments</b><div id="dCom"></div><div style="display:flex;gap:6px;margin-top:8px"><input id="dComI"><button class="btn p" style="width:auto" onclick="doCom()">Send</button></div></div>
</div></div></div>

<div id="dmM" class="modal"><div class="box"><div style="display:flex;justify-content:space-between"><h3>DMs</h3><span onclick="closeDM()" style="font-size:22px;cursor:pointer">✕</span></div><div id="dmList"></div></div></div>
<div id="chM" class="modal" style="align-items:flex-start"><div style="background:#fff;width:100%;max-width:480px;height:100vh;display:flex;flex-direction:column"><div style="padding:12px;border-bottom:1px solid #eee;display:flex;justify-content:space-between"><b id="chWith"></b><span onclick="closeCh()" style="font-size:22px;cursor:pointer">✕</span></div><div id="chBox" style="flex:1;overflow:auto;padding:12px"></div><div style="padding:12px;display:flex;gap:6px"><input id="chIn"><button class="btn p" style="width:auto" onclick="sendCh()">Send</button></div></div></div>
<div id="rM" class="modal" onclick="if(event.target==this)closeR()"><div class="box"><h3>Report</h3><select id="rRe"><option>Spam</option><option>Abusive</option><option>Fake</option></select><textarea id="rTx"></textarea><button class="btn p" onclick="subR()">Submit</button></div></div>
<div id="pM" class="modal" onclick="if(event.target==this)closeP()"><div class="box"><h3>Profile</h3><input id="pN" placeholder="Name *"><input id="pU" placeholder="University *"><input id="pC" placeholder="Country *"><button class="btn p" onclick="saveP()">Save Profile</button><button class="btn" style="width:100%;margin-top:8px" onclick="logout()">Logout</button></div></div>
<div id="exM" class="modal" onclick="if(event.target==this)closeEx()"><div class="box"><h3>Explore</h3><div id="exCats"></div></div></div>
<div id="toast" class="toast"></div>

<script>
const KEY="b2a23228af0e971d89e2f23ca35b40da";
const firebaseConfig={apiKey:"AIzaSyDu1BzhS8Thx5TxGFnlP93oQuI8Whl7Yjc",authDomain:"apexteen-5.firebaseapp.com",projectId:"apexteen-5",storageBucket:"apexteen-5.firebasestorage.app",messagingSenderId:"428961039333",appId:"1:428961039333:web:5dc05aae6f4fbe6c60250c"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(); const db=firebase.firestore();
let user=null,prof=null,mainF='all',ideas=[],cur=null,bans=[],editId=null,pend=[],chatWith=null,chatId=null;

auth.onAuthStateChanged(u=>{user=u;if(u){let s=localStorage.getItem('apex_'+u.uid);prof=s?JSON.parse(s):{name:u.displayName||'',avatar:u.photoURL||'',uni:'',country:''};document.getElementById('lb').innerText=prof.name.split(' ')[0]||'Student'}else{document.getElementById('lb').innerText='Login'}load();});

function login(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}
function logout(){auth.signOut();closeP()}
function toast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}

let fb=document.getElementById('fb'); fb.innerHTML=['all','Tech','AI','Coding','Study','Startup'].map((c,i)=>`<div class="chip ${i==0?'a':''}" data-f="${c}" onclick="setF(this)">${c}</div>`).join('')+`<div class="chip" data-f="my" onclick="setF(this)">My</div>`;
function setF(el){document.querySelectorAll('#fb .chip').forEach(x=>x.classList.remove('a'));el.classList.add('a');mainF=el.dataset.f;show()}
function home(){let e=document.querySelector('[data-f="all"]'); if(e)setF(e);}

async function load(){document.getElementById('feed').innerHTML='Loading...';try{let s=await db.collection('ideas').get();ideas=s.docs.map(d=>({id:d.id,...d.data()}))}catch(e){ideas=[]}show()}

function show(){
let q=(document.getElementById('s').value||'').toLowerCase();
let cf=document.getElementById('cFilter').value;
let af=(document.getElementById('aFilter').value||'').toLowerCase();
let list=[...ideas];
if(q)list=list.filter(i=> (i.tagline+i.desc).toLowerCase().includes(q));
if(cf!='all')list=list.filter(i=> (i.userCountry||'').toLowerCase().includes(cf.toLowerCase()));
if(af)list=list.filter(i=> (i.location||'').toLowerCase().includes(af));
if(mainF=='my'){if(!user){document.getElementById('feed').innerHTML='Login for My Ideas';return} list=list.filter(i=>i.uid===user.uid)} else if(mainF!='all')list=list.filter(i=>i.cat===mainF);
document.getElementById('feed').innerHTML=list.map(i=>`<div class="card" onclick="openDtl('${i.id}')">${(i.banners?.[0]||i.banner)?`<img src="${i.banners?.[0]||i.banner}">`:''}<div style="padding:12px"><div style="font-size:11px;color:#7c5cff">${i.cat} • ${i.location||''}</div><div style="font-weight:800">${i.tagline}</div><div style="font-size:12px;color:#666">${i.user} • ${i.userCountry||''}</div></div></div>`).join('')||'<div style="padding:20px;text-align:center">No results - try Bela, UP, California</div>';
}

function openDtl(id){cur=ideas.find(x=>x.id==id); if(!cur)return; document.getElementById('dCat').innerText=cur.cat+' • '+(cur.location||''); document.getElementById('dTT').innerText=cur.tagline; document.getElementById('dDes').innerText=cur.desc; document.getElementById('dOwn').innerText=cur.user+' • '+(cur.userCountry||'')+' • '+(cur.location||''); let all=[...(cur.banners||[]),cur.banner].filter(Boolean); document.getElementById('dGal').innerHTML=all.map(u=>`<img src="${u}" style="width:90px;height:70px;object-fit:cover;border-radius:8px">`).join(''); let bn=document.getElementById('dBan'); if(all[0]){bn.src=all[0];bn.style.display='block'}else bn.style.display='none'; document.getElementById('dCom').innerHTML=(cur.commentsList||[]).map(c=>`<div style="padding:6px 0;border-bottom:1px solid #eee"><b>${c.user}</b><div>${c.text}</div></div>`).join('')||'No comments'; document.getElementById('dM').classList.add('o'); let mine=user&&cur.uid==user.uid; document.getElementById('dEdit').style.display=mine?'block':'none'; document.getElementById('dDel').style.display=mine?'block':'none'; document.getElementById('dJoin').innerText=user&&cur.joinedUsers?.includes(user.uid)?'Supported ✓':'Support';}
function closeD(){document.getElementById('dM').classList.remove('o')}
function openC(){if(!user){login();return} if(!prof?.uni){toast('First complete profile');openP();return} editId=null;pend=[];bans=[];document.getElementById('cT').innerText='Post Idea';document.getElementById('cTitle').value='';document.getElementById('cDesc').value='';document.getElementById('cPrev').innerHTML='';document.getElementById('cM').classList.add('o')}
function closeC(){document.getElementById('cM').classList.remove('o')}
document.getElementById('cFile').addEventListener('change',e=>{pend=Array.from(e.target.files).slice(0,3);let box=document.getElementById('cPrev');box.innerHTML='';pend.forEach(f=>{let r=new FileReader();r.onload=ev=>{box.innerHTML+=`<img src="${ev.target.result}" style="width:80px;height:60px;object-fit:cover;border-radius:8px">`};r.readAsDataURL(f)})});
async function upImg(f){let fd=new FormData();fd.append('image',f);let r=await fetch(`https://api.imgbb.com/1/upload?key=${KEY}`,{method:'POST',body:fd});let d=await r.json();return d.data.url}
async function save(){let t=document.getElementById('cTitle').value.trim(),d=document.getElementById('cDesc').value.trim(),l=document.getElementById('cLoc').value,c=document.getElementById('cCat').value;if(!t||!d)return toast('Title+Desc');document.getElementById('cBtn').innerText='Uploading...';let urls=[];if(pend.length){for(let f of pend){urls.push(await upImg(f))}}else urls=bans;let first=urls[0]||'';try{if(editId){await db.collection('ideas').doc(editId).update({tagline:t,desc:d,location:l,cat:c,banner:first,banners:urls});}else{let doc=await db.collection('ideas').add({tagline:t,desc:d,location:l,cat:c,user:prof.name,userCountry:prof.country,uid:user.uid,joinedUsers:[],banner:first,banners:urls,commentsList:[],createdAt:firebase.firestore.FieldValue.serverTimestamp()});ideas.unshift({id:doc.id,tagline:t,desc:d,location:l,cat:c,user:prof.name,userCountry:prof.country,uid:user.uid,joinedUsers:[],banner:first,banners:urls,commentsList:[]})}}catch(e){toast(e.message)}closeC();load();toast('Done 🚀');document.getElementById('cBtn').innerText='Post'}
function doEdit(){closeD();editId=cur.id;bans=cur.banners||[];document.getElementById('cTitle').value=cur.tagline;document.getElementById('cDesc').value=cur.desc;document.getElementById('cLoc').value=cur.location||'';document.getElementById('cT').innerText='Edit Idea';document.getElementById('cM').classList.add('o')}
async function doDel(){if(!confirm('Delete?'))return;await db.collection('ideas').doc(cur.id).delete();closeD();load();toast('Deleted')}
async function join(){if(!user){login();return}if(!cur.joinedUsers)cur.joinedUsers=[];if(cur.joinedUsers.includes(user.uid))return;cur.joinedUsers.push(user.uid);try{await db.collection('ideas').doc(cur.id).update({joinedUsers:cur.joinedUsers})}catch{}toast('Supported ✅');document.getElementById('dJoin').innerText='Supported ✓';}
async function doCom(){if(!user){login();return}let t=document.getElementById('dComI').value.trim();if(!t)return;let c={user:prof.name,text:t};if(!cur.commentsList)cur.commentsList=[];cur.commentsList.push(c);try{await db.collection('ideas').doc(cur.id).update({commentsList:cur.commentsList})}catch{}document.getElementById('dComI').value='';document.getElementById('dCom').innerHTML=cur.commentsList.map(x=>`<div style="padding:6px 0;border-bottom:1px solid #eee"><b>${x.user}</b><div>${x.text}</div></div>`).join('')}
function doRep(){document.getElementById('rM').classList.add('o')}function closeR(){document.getElementById('rM').classList.remove('o')}
async function subR(){toast('Reported 🚩');closeR();closeD()}
function openDM(){if(!user){login();return}document.getElementById('dmM').classList.add('o');}function closeDM(){document.getElementById('dmM').classList.remove('o')}
function openChat(){document.getElementById('chM').classList.add('o')}function closeCh(){document.getElementById('chM').classList.remove('o')}
function doDM(){if(cur.uid==user.uid)return toast('Cannot DM yourself');openChat()}
function sendCh(){toast('DM sent (demo)')}
function openP(){if(!user){login();return}document.getElementById('pN').value=prof?.name||'';document.getElementById('pU').value=prof?.uni||'';document.getElementById('pC').value=prof?.country||'';document.getElementById('pM').classList.add('o')}
function closeP(){document.getElementById('pM').classList.remove('o')}
function saveP(){let n=document.getElementById('pN').value.trim(),u=document.getElementById('pU').value.trim(),c=document.getElementById('pC').value.trim();if(!n||!u||!c)return toast('All required');prof={...prof,name:n,uni:u,country:c};localStorage.setItem('apex_'+user.uid,JSON.stringify(prof));toast('Saved');closeP();document.getElementById('lb').innerText=n.split(' ')[0]}
function openEx(){document.getElementById('exM').classList.add('o')}function closeEx(){document.getElementById('exM').classList.remove('o')}
</script>
</body>
</html>
