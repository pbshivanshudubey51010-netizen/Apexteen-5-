<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ApexTeen5 - Global + DM + Report + Push</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}body{background:#f6f7f8;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:90px}
.header{position:sticky;top:0;background:#fff;z-index:20;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5e7eb}
.header b{font-size:20px;color:#f65858}.login{font-size:12px;background:#f65858;color:#fff;padding:8px 12px;border-radius:8px;border:none;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
.search-wrap{padding:12px 16px;background:#fff;border-bottom:1px solid #e5e7eb}.search{width:100%;background:#f6f7f8;border:1px solid #e5e7eb;border-radius:8px;padding:12px 16px;display:flex;gap:8px}.search input{border:none;outline:none;width:100%;background:transparent;font-size:14px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:#fff}.chip{white-space:nowrap;padding:8px 16px;border-radius:20px;border:1.5px solid #e5e7eb;background:#fff;font-size:13px;font-weight:600;cursor:pointer}.chip.active{background:#f65858;color:#fff;border-color:#f65858}
.card{background:#fff;margin:12px 16px;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06);cursor:pointer;border:1px solid #eee}
.card img.banner{width:100%;height:180px;object-fit:cover}.card-inner{padding:14px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:8px 0 14px;z-index:30}
.nav-item{text-align:center;font-size:11px;color:#9ca3af;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 14px;border-radius:12px;cursor:pointer;position:relative}.nav-item.active{color:#f65858;background:#fff1f1}.plus{width:54px;height:54px;background:#f65858;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;margin-top:-28px}.dot{position:absolute;top:4px;right:10px;width:8px;height:8px;background:#ef4444;border-radius:50%}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}
.modal-box{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px 16px 30px;max-height:92vh;overflow-y:auto}
.btn{padding:10px 14px;border-radius:10px;border:1.5px solid #e5e7eb;background:#fff;font-weight:700;font-size:13px;cursor:pointer}.btn.primary{background:#f65858;color:#fff;border-color:#f65858;width:100%;margin-top:10px;padding:14px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:100;display:none}
input,textarea,select{width:100%;padding:12px 14px;border:1px solid #e5e7eb;border-radius:10px;margin:8px 0;font-size:14px;outline:none}
.gallery{display:flex;gap:6px;overflow-x:auto;margin-top:8px}.gallery img{width:100px;height:80px;object-fit:cover;border-radius:8px}
.chat-bubble{padding:8px 12px;border-radius:12px;margin:4px 0;max-width:80%;font-size:13px}.me{background:#f65858;color:#fff;margin-left:auto}.other{background:#f3f4f6}
</style></head><body>
<div class="header"><b>ApexTeen5 🌍</b><div style="display:flex;gap:6px"><button class="login" style="background:#111" onclick="enablePush()">🔔</button><button id="loginBtn" class="login" onclick="handleAuth()">Login</button></div></div>
<div class="search-wrap"><div class="search">🔍<input id="searchInput" placeholder="Search..." oninput="render()"></div></div>
<div class="filters" id="filterBar"></div>
<div id="feed"></div>
<div class="bottom"><div class="nav-item active" onclick="goHome()">🏠<span>Home</span></div><div class="nav-item" onclick="openExplore()">🧭<span>Explore</span></div><div class="nav-item" onclick="openCreate()"><div class="plus">+</div><span>Idea</span></div><div class="nav-item" onclick="openDMs()"><span id="dmDot" class="dot" style="display:none"></span>💬<span>DM</span></div><div class="nav-item" onclick="openProfile()">👤<span>Profile</span></div></div>

<div id="createM" class="modal" onclick="if(event.target==this)closeCreate()"><div class="modal-box"><h3 id="createTitle">Share Idea 💡</h3><input id="cTagline" placeholder="Title *"><textarea id="cDesc" placeholder="Describe... *"></textarea><select id="cCat"><option>Tech</option><option>AI</option><option>Coding</option><option>Study</option><option>Startup</option></select><input id="cLocation" placeholder="City / Uni"><input type="file" id="cBanner" accept="image/*" multiple onchange="previewBanner(event)"><div id="bannerPrev" class="gallery"></div><div id="uploadStatus" style="font-size:12px;color:#f65858"></div><button class="btn primary" id="postBtn" onclick="saveEvent()">Post Globally</button></div></div>

<div id="detailM" class="modal" style="align-items:flex-start"><div style="background:#fff;width:100%;max-width:480px;height:100vh;overflow-y:auto"><div style="padding:12px 16px;display:flex;justify-content:space-between;border-bottom:1px solid #eee"><b id="dTitle"></b><span onclick="closeDetail()" style="font-size:22px;cursor:pointer">✕</span></div><div id="dGallery" class="gallery" style="padding:10px 16px"></div><img id="dBanner" style="width:100%;height:220px;object-fit:cover;display:none"><div style="padding:16px"><h2 id="dMainTitle" style="font-size:22px;font-weight:800"></h2><div style="display:flex;gap:8px;align-items:center;margin:6px 0"><img id="dOwnerAvatar" style="width:22px;height:22px;border-radius:50%;display:none"><span id="dOwner" style="font-size:13px;font-weight:600"></span><span id="dOwnerCountry" style="font-size:12px;color:#6b7280"></span></div><p id="dDesc" style="font-size:14px;color:#374151"></p><div style="display:flex;gap:6px;margin-top:12px"><button class="btn primary" id="dJoinBtn" onclick="joinFromDetail()" style="flex:1">Support</button><button class="btn" onclick="startDM()">💬 DM</button><button class="btn" onclick="openReport()">🚩 Report</button></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" id="dEditBtn" style="flex:1;display:none">Edit</button><button class="btn" id="dDelBtn" style="flex:1;color:#ef4444;display:none">Delete</button></div><div style="margin-top:16px"><b>Comments</b><div id="dComments"></div><div style="display:flex;gap:6px;margin-top:8px"><input id="dCommentInput"><button class="btn primary" style="width:auto" onclick="postComment()">Send</button></div></div></div></div></div>

<div id="dmListM" class="modal"><div class="modal-box" style="max-height:95vh"><div style="display:flex;justify-content:space-between"><h3>Messages 💬</h3><span onclick="closeDMs()" style="font-size:22px;cursor:pointer">✕</span></div><div id="dmList"></div></div></div>
<div id="chatM" class="modal" style="align-items:flex-start"><div style="background:#fff;width:100%;max-width:480px;height:100vh;display:flex;flex-direction:column"><div style="padding:12px 16px;border-bottom:1px solid #eee;display:flex;justify-content:space-between"><b id="chatWith"></b><span onclick="closeChat()" style="font-size:22px;cursor:pointer">✕</span></div><div id="chatBox" style="flex:1;overflow-y:auto;padding:12px"></div><div style="padding:12px;display:flex;gap:6px;border-top:1px solid #eee"><input id="chatInput" placeholder="Message..."><button class="btn primary" style="width:auto" onclick="sendDM()">Send</button></div></div></div>

<div id="reportM" class="modal" onclick="if(event.target==this)closeReport()"><div class="modal-box"><h3>Report Idea 🚩</h3><select id="reportReason"><option>Spam</option><option>Abusive</option><option>Fake</option><option>Other</option></select><textarea id="reportText" placeholder="Why reporting?"></textarea><button class="btn primary" onclick="submitReport()">Submit Report</button></div></div>

<div id="profileM" class="modal" onclick="if(event.target==this)closeProfile()"><div class="modal-box"><h3>Profile 🎓</h3><div style="text-align:center"><img id="pAvatar" style="width:80px;height:80px;border-radius:50%;object-fit:cover;background:#eee"><br><input type="file" id="pFile" accept="image/*" onchange="uploadAvatar(event)"><div id="pUploadStatus" style="font-size:12px;color:#f65858"></div></div><input id="pName" placeholder="Name *"><input id="pUni" placeholder="University *"><input id="pCountry" placeholder="Country *"><input id="pSkills" placeholder="Skills"><button class="btn primary" onclick="saveProfile()">Save</button><button class="btn" style="width:100%;margin-top:8px" onclick="enablePush()">🔔 Enable Push Notification</button><button class="btn" style="width:100%;margin-top:8px" onclick="auth.signOut();closeProfile()">Logout</button></div></div>

<div id="exploreM" class="modal" onclick="if(event.target==this)closeExplore()"><div class="modal-box"><h3>Explore</h3><div id="exploreCats" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px"></div></div></div>
<div id="toast" class="toast"></div>
<script>
const IMGBB_API_KEY="b2a23228af0e971d89e2f23ca35b40da";
const firebaseConfig={apiKey:"AIzaSyDu1BzhS8Thx5TxGFnlP93oQuI8Whl7Yjc",authDomain:"apexteen-5.firebaseapp.com",projectId:"apexteen-5",storageBucket:"apexteen-5.firebasestorage.app",messagingSenderId:"428961039333",appId:"1:428961039333:web:5dc05aae6f4fbe6c60250c"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth();const db=firebase.firestore();
let currentUser=null,profile=null,mainF='all',detailIdea=null,banners=[],editId=null,ideas=[],pendingFiles=[],chatWithUser=null,chatId=null;
const CATS=['all','Tech','AI','Coding','Study','Startup'];
auth.onAuthStateChanged(u=>{currentUser=u;if(u){let s=localStorage.getItem('apex_profile_'+u.uid);profile=s?JSON.parse(s):{name:u.displayName||'Student',avatar:u.photoURL||'',uni:'',country:'',skills:''};document.getElementById('loginBtn').innerHTML=`<img src="${profile.avatar||u.photoURL||''}" style="width:20px;height:20px;border-radius:50%"> ${profile.name.split(' ')[0]}`;listenDMs();}else{document.getElementById('loginBtn').innerText='Login'}loadIdeas();});
function initFilters(){let bar=document.getElementById('filterBar');bar.innerHTML=CATS.map((c,i)=>`<button class="chip ${i==0?'active':''}" data-f="${c}" onclick="setF(this)">${c=='all'?'All':c}</button>`).join('')+'<button class="chip" data-f="my" onclick="setF(this)">My</button>';document.getElementById('exploreCats').innerHTML=CATS.filter(c=>c!='all').map(c=>`<button class="chip" onclick="filterBy('${c}');closeExplore()">${c}</button>`).join('');}initFilters();
async function loadIdeas(){let snap=await db.collection('ideas').orderBy('createdAt','desc').get().catch(async()=>await db.collection('ideas').get());ideas=snap.docs.map(d=>({id:d.id,...d.data()}));if(ideas.length==0)ideas=[{id:'demo1',tagline:'Demo Idea',desc:'Test',cat:'Tech',user:'Demo',uid:'',joinedUsers:[],banner:'',banners:[],commentsList:[]}];render();}
function handleAuth(){if(currentUser)return;auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}
function setF(el){document.querySelectorAll('#filterBar .chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');mainF=el.dataset.f;render()}
function filterBy(c){setF(document.querySelector(`[data-f="${c}"]`))}
function goHome(){setF(document.querySelector('[data-f="all"]'))}
function previewBanner(e){pendingFiles=Array.from(e.target.files).slice(0,3);document.getElementById('bannerPrev').innerHTML='';pendingFiles.forEach(f=>{let r=new FileReader();r.onload=ev=>{document.getElementById('bannerPrev').innerHTML+=`<img src="${ev.target.result}">`;};r.readAsDataURL(f);});}
async function uploadToImgBB(f){let fd=new FormData();fd.append('image',f);let r=await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`,{method:'POST',body:fd});let d=await r.json();return d.data.url;}
function render(){let q=(document.getElementById('searchInput').value||'').toLowerCase();let list=[...ideas];if(q)list=list.filter(i=>(i.tagline+i.desc).toLowerCase().includes(q));if(mainF=='my'){if(!currentUser){document.getElementById('feed').innerHTML='<div style="text-align:center;padding:40px">Login</div>';return}list=list.filter(i=>i.uid===currentUser.uid)}else if(mainF!='all')list=list.filter(i=>i.cat===mainF);document.getElementById('feed').innerHTML=list.map(idea=>`<div class="card" onclick="openDetail('${idea.id}')">${(idea.banners?.[0]||idea.banner)?`<img class=banner src="${idea.banners?.[0]||idea.banner}">`:''}<div style="padding:14px"><div style="font-size:11px;color:#7c5cff;font-weight:700">${idea.cat}</div><div style="font-size:18px;font-weight:800">${idea.tagline}</div><div style="font-size:12px;color:#6b7280">👤 ${idea.user} • ${idea.userCountry||''} • ${idea.joinedUsers?.length||0} supports</div></div></div>`).join('')||'<div style="text-align:center;padding:40px">No ideas</div>';}
function openDetail(id){detailIdea=ideas.find(x=>x.id===id);document.getElementById('dTitle').innerText=detailIdea.cat;document.getElementById('dMainTitle').innerText=detailIdea.tagline;document.getElementById('dDesc').innerText=detailIdea.desc;document.getElementById('dOwner').innerText=detailIdea.user;document.getElementById('dOwnerCountry').innerText=detailIdea.userCountry||'';let av=document.getElementById('dOwnerAvatar');if(detailIdea.userAvatar){av.src=detailIdea.userAvatar;av.style.display='block'}else av.style.display='none';let all=[...(detailIdea.banners||[]),detailIdea.banner].filter(Boolean);document.getElementById('dGallery').innerHTML=all.map(u=>`<img src="${u}" style="width:90px;height:70px;object-fit:cover;border-radius:8px" onclick="window.open('${u}')">`).join('');let b=document.getElementById('dBanner');if(all[0]){b.src=all[0];b.style.display='block'}else b.style.display='none';document.getElementById('dComments').innerHTML=(detailIdea.commentsList||[]).map(c=>`<div style="padding:6px 0;border-bottom:1px solid #eee"><b style="font-size:12px">${c.user}</b><div style="font-size:13px">${c.text}</div></div>`).join('')||'No comments';document.getElementById('detailM').classList.add('open');updateBtn();}
function closeDetail(){document.getElementById('detailM').classList.remove('open')}
function updateBtn(){let isMine=currentUser&&detailIdea.uid===currentUser.uid;document.getElementById('dEditBtn').style.display=isMine?'block':'none';document.getElementById('dDelBtn').style.display=isMine?'block':'none';let btn=document.getElementById('dJoinBtn');btn.disabled=currentUser&&detailIdea.joinedUsers?.includes(currentUser.uid);btn.innerText=btn.disabled?'Supported ✓':'Support';}
function openCreate(){if(!currentUser){handleAuth();return}if(!profile?.uni){toast('First complete profile');openProfile();return}editId=null;pendingFiles=[];banners=[];document.getElementById('createM').classList.add('open')}
function closeCreate(){document.getElementById('createM').classList.remove('open')}
function editEvent(){if(detailIdea.uid!==currentUser.uid){toast('Owner only');return}closeDetail();editId=detailIdea.id;banners=detailIdea.banners||[];document.getElementById('cTagline').value=detailIdea.tagline;document.getElementById('cDesc').value=detailIdea.desc;document.getElementById('cLocation').value=detailIdea.location||'';document.getElementById('bannerPrev').innerHTML=banners.map(u=>`<img src="${u}">`).join('');document.getElementById('createM').classList.add('open')}
async function saveEvent(){let tag=document.getElementById('cTagline').value.trim(),d=document.getElementById('cDesc').value.trim(),loc=document.getElementById('cLocation').value,cat=document.getElementById('cCat').value;if(!tag||!d)return toast('Title Desc');document.getElementById('postBtn').innerText='Uploading...';let urls=[];if(pendingFiles.length>0){for(let f of pendingFiles){urls.push(await uploadToImgBB(f))}}else urls=banners;let first=urls[0]||'';if(editId){await db.collection('ideas').doc(editId).update({tagline:tag,desc:d,location:loc,cat,banner:first,banners:urls});let i=ideas.findIndex(x=>x.id===editId);ideas[i]={...ideas[i],tagline:tag,desc:d,location:loc,cat,banner:first,banners:urls}}else{let doc=await db.collection('ideas').add({tagline:tag,desc:d,location:loc,cat,user:profile.name,userAvatar:profile.avatar,userCountry:profile.country,uid:currentUser.uid,joinedUsers:[],banner:first,banners:urls,commentsList:[],createdAt:firebase.firestore.FieldValue.serverTimestamp()});ideas.unshift({id:doc.id,tagline:tag,desc:d,location:loc,cat,user:profile.name,userAvatar:profile.avatar,userCountry:profile.country,uid:currentUser.uid,joinedUsers:[],banner:first,banners:urls,commentsList:[]})}closeCreate();render();toast('Posted 🚀');document.getElementById('postBtn').innerText='Post Globally'}
async function deleteIdea(){if(detailIdea.uid!==currentUser.uid)return;if(!confirm('Delete?'))return;await db.collection('ideas').doc(detailIdea.id).delete();ideas=ideas.filter(i=>i.id!==detailIdea.id);closeDetail();render();toast('Deleted')}
async function joinFromDetail(){if(!currentUser){handleAuth();return}detailIdea.joinedUsers=detailIdea.joinedUsers||[];if(detailIdea.joinedUsers.includes(currentUser.uid))return;detailIdea.joinedUsers.push(currentUser.uid);await db.collection('ideas').doc(detailIdea.id).update({joinedUsers:detailIdea.joinedUsers});if(Notification.permission==='granted'){new Notification('New Support!',{body:`${profile.name} supported your idea`})}toast('Supported ✅');updateBtn();render();}
async function postComment(){if(!currentUser){toast('Login');return}let t=document.getElementById('dCommentInput').value.trim();if(!t)return;let c={user:profile.name,text:t};detailIdea.commentsList.push(c);await db.collection('ideas').doc(detailIdea.id).update({commentsList:detailIdea.commentsList});document.getElementById('dCommentInput').value='';document.getElementById('dComments').innerHTML=detailIdea.commentsList.map(x=>`<div style="padding:6px 0;border-bottom:1px solid #eee"><b style="font-size:12px">${x.user}</b><div style="font-size:13px">${x.text}</div></div>`).join('');}
// Report
function openReport(){if(!currentUser){handleAuth();return}document.getElementById('reportM').classList.add('open')}
function closeReport(){document.getElementById('reportM').classList.remove('open')}
async function submitReport(){let reason=document.getElementById('reportReason').value,txt=document.getElementById('reportText').value;await db.collection('reports').add({ideaId:detailIdea.id,ideaTagline:detailIdea.tagline,reportedBy:currentUser.uid,reporterEmail:currentUser.email,reason,text:txt,at:firebase.firestore.FieldValue.serverTimestamp()});toast('Reported to Admin 🚩');closeReport();closeDetail();}
// DM System
function openDMs(){if(!currentUser){handleAuth();return}document.getElementById('dmListM').classList.add('open');loadDMList()}
function closeDMs(){document.getElementById('dmListM').classList.remove('open')}
async function loadDMList(){
 let q=await db.collection('chats').where('users','array-contains',currentUser.uid).orderBy('lastAt','desc').get().catch(()=>db.collection('chats').where('users','array-contains',currentUser.uid).get());
 let div=document.getElementById('dmList');if(q.empty){div.innerHTML='<div style="text-align:center;padding:20px;color:#9ca3af">No messages yet</div>';return}
 div.innerHTML=q.docs.map(d=>{let data=d.data();let other=data.users.find(u=>u!==cu
