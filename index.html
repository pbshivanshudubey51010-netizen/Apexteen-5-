<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6D4AFF">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>ApexTeen5</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--p:#6D4AFF;--s:#F0EBFF;--bg:#F3F0FB;--card:#fff;--tx:#1d1736;--mu:#6b6488;--bd:#e2dcf5;--ok:#17855a;--er:#d12f4b}
@media (prefers-color-scheme:dark){:root{--s:#2a2252;--bg:#14102a;--card:#1d1838;--tx:#f1eeff;--mu:#a49cc8;--bd:#352d62;--ok:#4cd39b;--er:#ff7a93}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;font-size:15px}
#app{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:80px;padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3{margin:0}button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;margin-top:5px}
textarea{min-height:90px;resize:vertical}
label{display:block;font-weight:600;font-size:13px;margin-top:12px}
.btn{background:var(--p);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:700;width:100%;margin-top:14px}
.btn.alt{background:var(--s);color:var(--p)}.btn.sm{width:auto;margin:0;padding:8px 12px;font-size:13px}
.btn[disabled]{opacity:.5}
.wrap{padding:16px}.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.av{width:40px;height:40px;border-radius:50%;background:var(--s);display:grid;place-items:center;font-weight:800;color:var(--p);flex:none}
.badge{background:var(--s);color:var(--p);border-radius:99px;padding:3px 9px;font-size:12px;font-weight:600;display:inline-block}
.ok{color:var(--ok)}.mu{color:var(--mu);font-size:13px}.err{color:var(--er);font-size:13px;margin-top:8px}
.hero{background:var(--p);color:#fff;padding:26px 18px 28px;border-radius:0 0 26px 26px}
.hero h1{font-size:30px;font-weight:800;letter-spacing:-.5px}.hero p{margin:6px 0 0;opacity:.9}
.top{position:sticky;top:0;background:var(--bg);z-index:5;padding:12px 16px 8px}.logo{font-weight:800;font-size:20px;color:var(--p)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:7px 13px;white-space:nowrap;font-weight:600;font-size:13px}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.hi{width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-top:10px}
.stats{display:flex;gap:12px;margin-top:12px;align-items:center}
.act{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:7px 11px;font-weight:600;font-size:13px}
.act.on{background:var(--s);color:var(--p);border-color:var(--p)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:6px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}nav button.on{color:var(--p)}
nav button.plus span{background:var(--p);color:#fff;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin-top:-22px;font-size:26px;box-shadow:0 4px 12px rgba(109,74,255,.4)}
.sheet-bg{position:fixed;inset:0;background:rgba(20,10,50,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:430px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.msg{background:var(--s);border-radius:12px;padding:8px 11px;margin-top:8px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.note{background:var(--s);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:30;font-weight:600;font-size:14px;max-width:90%}
.tabs{display:flex;gap:8px;margin-bottom:6px}.tabs .chip{flex:1}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:13px;font-weight:500}.chk input{width:auto;margin:3px 0 0}
</style>
</head>
<body>
<div id="app"></div>
<datalist id="countries"><option>India</option><option>USA</option><option>UK</option><option>UAE</option><option>Canada</option><option>Australia</option><option>Nepal</option></datalist>
<datalist id="states"><option>Delhi</option><option>Maharashtra</option><option>Uttar Pradesh</option><option>Bihar</option><option>Gujarat</option><option>Karnataka</option><option>Tamil Nadu</option><option>Rajasthan</option><option>West Bengal</option><option>Madhya Pradesh</option></datalist>
<script>
/* Firebase web config: ye secret nahi hota. Asli suraksha database.rules.json se aati hai. */
firebase.initializeApp({
  apiKey:"AIzaSyD0E3rkvkP8Sf8VpvLmf0-O5YUldjCLDZA",
  authDomain:"apexteen-5-a5c17.firebaseapp.com",
  databaseURL:"https://apexteen-5-a5c17-default-rtdb.firebaseio.com",
  projectId:"apexteen-5-a5c17",
  storageBucket:"apexteen-5-a5c17.firebasestorage.app",
  messagingSenderId:"322620785774",
  appId:"1:322620785774:web:29b6f575c25584b0e3127f"
});
var auth=firebase.auth(),db=firebase.database(),TS=firebase.database.ServerValue.TIMESTAMP;
var CAT={ai:'🤖 AI & tech',game:'🎮 Gaming & design',social:'👥 Social good & science'};
var S={u:null,me:null,ok:false,adm:false,ideas:{},votes:{},users:{},inbox:{},outbox:{},pend:{},tab:'home',cat:'all',q:'',fc:'',fs:'',mode:'in',err:'',busy:false};
var L=[],pendOn=false;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function safeUrl(u){u=(u||'').trim();return /^https:\/\/[^\s"'<>]+$/i.test(u)?u:''}
function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},2600)}
function av(n){return '<div class="av">'+esc((n||'?').charAt(0).toUpperCase())+'</div>'}
function listen(path,fn,q){var r=db.ref(path);if(q)r=q(r);r.on('value',fn,function(){});L.push(r)}
function detach(){L.forEach(function(r){r.off()});L=[]}
function ago(t){if(!t)return'';var m=Math.floor((Date.now()-t)/60000);return m<1?'abhi':m<60?m+' min pehle':m<1440?Math.floor(m/60)+' ghante pehle':Math.floor(m/1440)+' din pehle'}
var ERR={'auth/email-already-in-use':'Ye email pehle se registered hai. Login karein.','auth/invalid-email':'Email sahi nahi hai.','auth/weak-password':'Password kam se kam 8 akshar ka rakhein.','auth/wrong-password':'Email ya password galat hai.','auth/user-not-found':'Email ya password galat hai.','auth/invalid-credential':'Email ya password galat hai.','auth/invalid-login-credentials':'Email ya password galat hai.','auth/too-many-requests':'Bahut koshishein ho gayi. Thodi der baad try karein.','auth/network-request-failed':'Internet check karein.'};
function emsg(e){return ERR[e&&e.code]||('Kuch gadbad hui: '+((e&&e.message)||'dobara try karein'))}

/* ---------- session ---------- */
auth.onAuthStateChanged(function(u){
  detach();pendOn=false;S.u=u;S.me=null;S.ok=false;S.adm=false;S.ideas={};S.votes={};S.users={};S.inbox={};S.outbox={};S.pend={};
  if(!u){render();return}
  var id=u.uid;
  listen('users/'+id,function(s){S.me=s.val();render()});
  listen('approved/'+id,function(s){S.ok=s.val()===true;render()});
  listen('admins/'+id,function(s){S.adm=s.val()===true;if(S.adm&&!pendOn){pendOn=true;listen('pending',function(p){S.pend=p.val()||{};refresh()})}refresh()});
  listen('ideas',function(s){S.ideas=s.val()||{};refresh()},function(r){return r.orderByChild('ts').limitToLast(100)});
  listen('votes',function(s){S.votes=s.val()||{};refresh()});
  listen('users',function(s){S.users=s.val()||{};refresh()});
  listen('inbox/'+id,function(s){S.inbox=s.val()||{};refresh()});
  listen('outbox/'+id,function(s){S.outbox=s.val()||{};refresh()});
});
function render(){
  if(!S.u){authView();return}
  if(!S.me){$('app').innerHTML='<div class="wrap mu" style="padding-top:40px;text-align:center">Profile load ho raha hai…</div>';return}
  ({home:home,find:findTab,me:meTab})[S.tab]();
}
function refresh(){if(!S.u||!S.me)return;if(S.tab==='me'){meTab();return}if($('list'))fillList()}

/* ---------- login / signup ---------- */
function authView(){
  var up=S.mode==='up';
  $('app').innerHTML='<div class="hero"><h1>ApexTeen5</h1><p>Teen innovators ka idea hub. Parent ki approval ke baad hi posting.</p></div><div class="wrap"><div class="card"><div class="tabs"><button class="chip'+(!up?' on':'')+'" id="t1">Login</button><button class="chip'+(up?' on':'')+'" id="t2">Naya account</button></div>'+
  (up?'<label>Full name</label><input id="fn" maxlength="40" autocomplete="name"><label>Email</label><input id="em" type="email" autocomplete="email"><label>Password (8+ akshar)</label><input id="pw" type="password" autocomplete="new-password"><label>Mobile number</label><input id="mb" inputmode="numeric" maxlength="10"><label>Class</label><select id="cl"><option>9th</option><option>10th</option><option>11th</option><option>12th</option></select><label>Field of interest</label><select id="fi"><option value="ai">'+CAT.ai+'</option><option value="game">'+CAT.game+'</option><option value="social">'+CAT.social+'</option></select><label>Country</label><input id="co" list="countries" value="India"><label>State</label><input id="sa" list="states"><label>District / city</label><input id="ct" maxlength="40"><label>Parent ka mobile ya email</label><input id="pe" maxlength="60"><label class="chk"><input id="cs" type="checkbox"><span>Mere parent ko pata hai aur wo mere is app use karne ke liye sahmat hain.</span></label>'
  :'<label>Email</label><input id="em" type="email" autocomplete="email"><label>Password</label><input id="pw" type="password" autocomplete="current-password">')+
  '<div class="err" id="er">'+esc(S.err)+'</div><button class="btn" id="go">'+(up?'Account banao':'Login')+'</button></div></div>';
  $('t1').onclick=function(){S.mode='in';S.err='';authView()};$('t2').onclick=function(){S.mode='up';S.err='';authView()};
  $('go').onclick=up?signup:login;
}
function fail(m){S.err=m;var e=$('er');if(e)e.textContent=m;var b=$('go');if(b)b.disabled=false}
function login(){
  var b=$('go');b.disabled=true;
  auth.signInWithEmailAndPassword($('em').value.trim(),$('pw').value).catch(function(e){fail(emsg(e))});
}
function signup(){
  var v=function(i){return $(i).value.trim()},name=v('fn'),mob=v('mb'),pe=v('pe');
  if(name.length<2)return fail('Apna naam likhein.');
  if(!/^\d{10}$/.test(mob))return fail('10 digit ka mobile number daalein.');
  if($('pw').value.length<8)return fail('Password kam se kam 8 akshar ka rakhein.');
  if(!v('sa'))return fail('State likhein.');
  if(pe.length<5)return fail('Parent ka mobile ya email likhein.');
  if(!$('cs').checked)return fail('Parent ki sahmati wala box tick karein.');
  $('go').disabled=true;
  auth.createUserWithEmailAndPassword(v('em'),$('pw').value).then(function(c){
    var id=c.user.uid,up={};
    up['users/'+id]={name:name,cls:v('cl'),interest:v('fi'),country:v('co')||'India',state:v('sa'),city:v('ct')};
    up['private/'+id]={mobile:mob,email:v('em'),parentContact:pe};
    up['pending/'+id]={name:name,parentContact:pe,ts:TS};
    return db.ref().update(up);
  }).catch(function(e){fail(emsg(e))});
}

/* ---------- shell ---------- */
function shell(inner){
  var t=[['home','🏠','Home'],['find','🔍','Find'],['create','➕','Create'],['me','👤','Profile']];
  $('app').innerHTML=(S.ok?'':'<div class="note" style="margin:10px 16px 0">⏳ Parent approval pending. Tab tak aap ideas dekh sakte ho, par post, vote ya message nahi kar sakte.</div>')+inner+
  '<nav>'+t.map(function(x){return '<button data-t="'+x[0]+'" class="'+(S.tab===x[0]?'on ':'')+(x[0]==='create'?'plus':'')+'" aria-label="'+x[2]+'"><span>'+x[1]+'</span>'+(x[0]==='create'?'':x[2])+'</button>'}).join('')+'</nav>';
  Array.prototype.forEach.call(document.querySelectorAll('nav button'),function(b){b.onclick=function(){if(b.dataset.t==='create'){createSheet()}else{S.tab=b.dataset.t;render()}}});
}
function sheet(html){var bg=document.createElement('div');bg.className='sheet-bg';bg.innerHTML='<div class="sheet" role="dialog">'+html+'</div>';document.body.appendChild(bg);return bg}
function needOk(){if(S.ok)return true;toast('Pehle parent approval chahiye.');return false}

/* ---------- ideas list ---------- */
function allIdeas(){return Object.keys(S.ideas).map(function(k){var o=S.ideas[k];o.id=k;return o}).sort(function(a,b){return(b.ts||0)-(a.ts||0)})}
function votesOf(id){return S.votes[id]||{}}
function card(i){
  var vs=votesOf(i.id),n=Object.keys(vs).length,has=!!vs[S.u.uid],img=safeUrl(i.img);
  return '<article class="card" data-id="'+esc(i.id)+'"><div class="row">'+av(i.author)+'<div style="flex:1"><b>'+esc(i.author)+'</b><div class="mu">'+esc(ago(i.ts))+'</div></div><span class="badge">'+esc((CAT[i.cat]||'').split(' ')[0])+'</span></div>'+
  '<h3 style="margin-top:10px">'+esc(i.title)+'</h3>'+(img?'<img class="hi" alt="" src="'+esc(img)+'" onerror="this.remove()">':'')+
  '<p style="margin:8px 0 0;color:var(--mu);line-height:1.5">'+esc(i.summary)+'</p>'+
  '<div class="stats"><button class="act'+(has?' on':'')+'" data-up="'+esc(i.id)+'">👍 '+n+'</button><span class="mu">📍 '+esc(i.state||'')+'</span><span style="flex:1"></span><button class="btn sm" data-open="'+esc(i.id)+'">Dekho</button></div></article>';
}
function bindCards(root){
  Array.prototype.forEach.call(root.querySelectorAll('[data-up]'),function(b){b.onclick=function(e){e.stopPropagation();vote(b.dataset.up)}});
  Array.prototype.forEach.call(root.querySelectorAll('[data-open]'),function(b){b.onclick=function(){detail(b.dataset.open)}});
}
function vote(id){
  if(!needOk())return;var r=db.ref('votes/'+id+'/'+S.u.uid),has=!!votesOf(id)[S.u.uid];
  r.set(has?null:true).catch(function(e){toast(emsg(e))});
}
function home(){
  var c=[['all','✨ All ideas'],['ai','🤖 AI & tech'],['game','🎮 Gaming'],['social','👥 Social']];
  shell('<div class="top"><div class="row sp"><span class="logo">ApexTeen5</span><span class="badge">📍 '+esc(S.me.country)+', '+esc(S.me.state)+'</span></div><input id="sq" placeholder="🔎 Ideas aur keywords search karein" value="'+esc(S.q)+'"><div class="row" style="margin-top:6px"><input id="fc" list="countries" placeholder="Country filter" value="'+esc(S.fc)+'"><input id="fs" list="states" placeholder="State filter" value="'+esc(S.fs)+'"></div><div class="chips">'+c.map(function(x){return '<button class="chip'+(S.cat===x[0]?' on':'')+'" data-c="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div></div><div class="wrap" id="list" style="padding-top:4px"></div>');
  $('sq').oninput=function(e){S.q=e.target.value;fillList()};
  $('fc').oninput=function(e){S.fc=e.target.value;fillList()};$('fs').oninput=function(e){S.fs=e.target.value;fillList()};
  Array.prototype.forEach.call(document.querySelectorAll('.chip[data-c]'),function(b){b.onclick=function(){S.cat=b.dataset.c;home()}});
  fillList();
}
function fillList(){
  var el=$('list');if(!el)return;
  if(S.tab==='find'){fillPeople(el);return}
  var q=S.q.toLowerCase(),fc=S.fc.toLowerCase(),fs=S.fs.toLowerCase();
  var l=allIdeas().filter(function(i){return(S.cat==='all'||i.cat===S.cat)&&(!fc||(i.country||'').toLowerCase()===fc)&&(!fs||(i.state||'').toLowerCase().indexOf(fs)>-1)&&(!q||((i.title||'')+' '+(i.summary||'')+' '+(i.author||'')).toLowerCase().indexOf(q)>-1)});
  el.innerHTML=l.length?l.map(card).join(''):'<div class="card mu">Koi idea nahi mila. Filter badlein ya ➕ se pehla idea post karein.</div>';
  bindCards(el);
}

/* ---------- create idea ---------- */
function createSheet(){
  if(!needOk())return;
  var s=sheet('<h2>Naya idea post karein</h2><div class="note" style="margin-top:10px">Feed mein sirf title aur chhota summary dikhta hai. Poori detail sirf unhe dikhti hai jinhe aap approve karte ho.</div><label>Idea title</label><input id="ti" maxlength="90"><label>Chhota summary (feed mein sabko dikhega)</label><textarea id="su" maxlength="300"></textarea><label>Poori detail (sirf approved collaborator ko)</label><textarea id="de" maxlength="5000" style="min-height:120px"></textarea><label>Category</label><select id="ca"><option value="ai">'+CAT.ai+'</option><option value="game">'+CAT.game+'</option><option value="social">'+CAT.social+'</option></select><label>Image link (https, optional)</label><input id="iu" placeholder="https://..."><div class="err" id="er"></div><button class="btn" id="go">Post idea now</button><button class="btn alt" id="cn">Cancel</button>');
  s.onclick=function(e){if(e.target===s)s.remove()};
  s.querySelector('#ca').value=S.me.interest||'ai';
  s.querySelector('#cn').onclick=function(){s.remove()};
  s.querySelector('#go').onclick=function(){
    var q=function(x){return s.querySelector(x)},t=q('#ti').value.trim(),su=q('#su').value.trim(),de=q('#de').value.trim(),iu=q('#iu').value.trim();
    if(t.length<3||su.length<10||de.length<20){q('#er').textContent='Title, summary (10+ akshar) aur detail (20+ akshar) likhein.';return}
    if(iu&&!safeUrl(iu)){q('#er').textContent='Image link https:// se shuru hona chahiye.';return}
    var id=db.ref('ideas').push().key,up={};
    up['ideas/'+id]={uid:S.u.uid,author:S.me.name,title:t,summary:su,cat:q('#ca').value,country:S.me.country,state:S.me.state,img:iu,ts:TS};
    up['ideaSecret/'+id]={owner:S.u.uid,detail:de};
    q('#go').disabled=true;
    db.ref().update(up).then(function(){s.remove();S.tab='home';render();toast('Idea post ho gaya')}).catch(function(e){q('#go').disabled=false;q('#er').textContent=emsg(e)});
  };
}

/* ---------- idea detail + private requests ---------- */
function detail(id){
  var i=S.ideas[id];if(!i)return;
  var mine=i.uid===S.u.uid,cm={},secret=null,denied=false,cref=db.ref('comments/'+id).orderByChild('ts').limitToLast(50);
  var s=sheet('<div id="dt"></div>');
  function close(){cref.off();s.remove()}
  s.onclick=function(e){if(e.target===s)close()};
  function draw(){
    var d=s.querySelector('#dt'),q=function(x){return d.querySelector(x)};
    var reqs=Object.keys(S.outbox).map(function(k){return S.outbox[k]}).filter(function(m){return m.ideaId===id});
    var cmh=Object.keys(cm).map(function(k){return cm[k]}).sort(function(a,b){return a.ts-b.ts}).map(function(c){return '<div class="msg"><b>'+esc(c.name)+'</b><br>'+esc(c.text)+'</div>'}).join('');
    var img=safeUrl(i.img);
    d.innerHTML='<div class="row sp"><h2 style="font-size:19px">'+esc(i.title)+'</h2><button class="act" id="x" aria-label="Band karein">✕</button></div><div class="row" style="margin-top:8px">'+av(i.author)+'<div><b>'+esc(i.author)+'</b><div class="mu">📍 '+esc(i.state||'')+', '+esc(i.country||'')+'</div></div></div>'+(img?'<img class="hi" alt="" src="'+esc(img)+'" onerror="this.remove()">':'')+
    '<p style="line-height:1.6">'+esc(i.summary)+'</p>'+
    '<div class="card" style="background:var(--s)"><h3>🔒 Poori detail</h3>'+
    (secret?'<div class="msg" style="background:var(--card)">'+esc(secret.detail)+'</div>':
     denied?(reqs.length?reqs.map(function(m){return '<div class="msg">Aapki request: <b>'+esc(m.status==='approved'?'approved':m.status==='declined'?'decline hui':'owner ke jawab ka intezar')+'</b>'+(m.reply?'<br>Owner: '+esc(m.reply):'')+'</div>'}).join(''):'')+
       (S.ok?'<p class="mu" style="margin:8px 0 0">Owner approve karega to detail yahan khul jayegi. Apna skill aur judne ka tareeka likhein.</p><textarea id="rq" maxlength="600" placeholder="Apna message"></textarea><button class="btn" id="sr">Owner ko private request bhejo</button>':'<p class="mu">Parent approval ke baad request bhej sakte ho.</p>')
     :'<p class="mu">Load ho raha hai…</p>')+'</div>'+
    '<div class="row" style="gap:8px">'+(mine?'<button class="act" id="dl">🗑 Idea hatao</button>':'<button class="act" id="rp">🚩 Report</button>')+'</div>'+
    '<h3 style="margin-top:14px">Public comments</h3>'+cmh+'<div class="row" style="margin-top:8px"><input id="cmt" maxlength="300" placeholder="Comment (idea ki private detail yahan na likhein)" style="margin:0"><button class="btn sm" id="pc">Post</button></div>';
    q('#x').onclick=close;
    if(q('#sr'))q('#sr').onclick=function(){
      var t=q('#rq').value.trim();if(t.length<5)return toast('Thoda detail mein likhein.');
      var mid=db.ref('inbox/'+i.uid).push().key,up={},base={ideaId:id,ideaTitle:i.title,text:t,ts:TS,status:'pending'};
      up['inbox/'+i.uid+'/'+mid]=Object.assign({from:S.u.uid,fromName:S.me.name},base);
      up['outbox/'+S.u.uid+'/'+mid]=Object.assign({to:i.uid},base);
      db.ref().update(up).then(function(){toast('Request bhej di')}).catch(function(e){toast(emsg(e))});
    };
    if(q('#dl'))q('#dl').onclick=function(){if(!confirm('Ye idea hamesha ke liye hata dein?'))return;var up={};up['ideas/'+id]=null;up['ideaSecret/'+id]=null;db.ref().update(up).then(close).catch(function(e){toast(emsg(e))})};
    if(q('#rp'))q('#rp').onclick=function(){db.ref('reports').push({idea:id,by:S.u.uid,ts:TS}).then(function(){toast('Report bhej di. Shukriya.')}).catch(function(e){toast(emsg(e))})};
    q('#pc').onclick=function(){
      var t=q('#cmt').value.trim();if(!t)return;if(!needOk())return;
      db.ref('comments/'+id).push({uid:S.u.uid,name:S.me.name,text:t,ts:TS}).catch(function(e){toast(emsg(e))});
    };
  }
  cref.on('value',function(sn){cm=sn.val()||{};draw()});
  db.ref('ideaSecret/'+id).once('value').then(function(sn){secret=sn.val();draw()}).catch(function(){denied=true;draw()});
}

/* ---------- find ---------- */
function findTab(){
  shell('<div class="top"><span class="logo">Find co-founders</span><input id="sq" placeholder="Naam, state ya field search karein" value="'+esc(S.q)+'"></div><div class="wrap" id="list" style="padding-top:4px"></div>');
  $('sq').oninput=function(e){S.q=e.target.value;fillList()};fillList();
}
function fillPeople(el){
  var q=S.q.toLowerCase();
  var l=Object.keys(S.users).filter(function(k){return k!==S.u.uid}).map(function(k){var u=S.users[k];u.id=k;return u}).filter(function(u){return!q||((u.name||'')+' '+(u.state||'')+' '+(u.city||'')+' '+(CAT[u.interest]||'')).toLowerCase().indexOf(q)>-1});
  el.innerHTML=l.length?l.map(function(u){return '<div class="card row">'+av(u.name)+'<div style="flex:1"><b>'+esc(u.name)+'</b><div class="mu">Class '+esc(u.cls)+' · 📍 '+esc(u.state)+' · '+esc(CAT[u.interest]||'')+'</div></div><button class="btn sm" data-by="'+esc(u.name)+'">Ideas</button></div>'}).join(''):'<div class="card mu">Abhi koi aur student nahi mila.</div>';
  Array.prototype.forEach.call(el.querySelectorAll('[data-by]'),function(b){b.onclick=function(){S.q=b.dataset.by;S.tab='home';render()}});
}

/* ---------- profile, inbox, admin ---------- */
function meTab(){
  var uid=S.u.uid,mine=allIdeas().filter(function(i){return i.uid===uid});
  var inb=Object.keys(S.inbox).map(function(k){var m=S.inbox[k];m.id=k;return m}).sort(function(a,b){return b.ts-a.ts});
  var out=Object.keys(S.outbox).map(function(k){var m=S.outbox[k];m.id=k;return m}).sort(function(a,b){return b.ts-a.ts});
  var pend=Object.keys(S.pend).map(function(k){var p=S.pend[k];p.id=k;return p});
  shell('<div class="hero"><div class="row">'+av(S.me.name)+'<div><h1 style="font-size:22px">'+esc(S.me.name)+'</h1><p>Class '+esc(S.me.cls)+' · '+esc(S.me.city||S.me.state)+'</p></div></div><p style="margin-top:12px">'+(S.ok?'✓ Parent verified':'⏳ Parent approval pending')+' · '+esc(CAT[S.me.interest]||'')+'</p></div><div class="wrap">'+
  (S.adm?'<h3 style="margin:0 0 8px">Admin: approval ka intezar ('+pend.length+')</h3>'+(pend.length?pend.map(function(p){return '<div class="card"><b>'+esc(p.name)+'</b><div class="mu">Parent: '+esc(p.parentContact)+'</div><button class="btn sm" style="margin-top:8px" data-ap="'+esc(p.id)+'">Parent se baat hui, approve karo</button></div>'}).join(''):'<div class="card mu">Koi pending nahi.</div>'):'')+
  '<h3 style="margin:6px 0 8px">Mujhe aayi private requests ('+inb.length+')</h3>'+(inb.length?inb.map(function(m){return '<div class="card"><b>'+esc(m.fromName)+'</b> · <span class="mu">'+esc(m.ideaTitle)+'</span><div class="msg">'+esc(m.text)+'</div>'+(m.reply?'<div class="msg">Aapka jawab: '+esc(m.reply)+'</div>':'')+(m.status==='pending'?'<input data-rp="'+esc(m.id)+'" placeholder="Jawab (optional)" maxlength="300"><div class="row" style="margin-top:8px"><button class="btn sm" data-ac="'+esc(m.id)+'">Approve, detail dikhao</button><button class="btn sm alt" data-dc="'+esc(m.id)+'">Decline</button></div>':'<div class="mu" style="margin-top:6px">Status: '+esc(m.status)+'</div>')+'</div>'}).join(''):'<div class="card mu">Abhi koi request nahi.</div>')+
  '<h3 style="margin:6px 0 8px">Meri bheji requests ('+out.length+')</h3>'+(out.length?out.map(function(m){return '<div class="card"><span class="mu">'+esc(m.ideaTitle)+'</span><div class="msg">'+esc(m.text)+'</div><div class="mu" style="margin-top:6px">Status: '+esc(m.status)+'</div>'+(m.reply?'<div class="msg">Owner: '+esc(m.reply)+'</div>':'')+'</div>'}).join(''):'<div class="card mu">Koi request nahi bheji.</div>')+
  '<h3 style="margin:6px 0 8px">Mere ideas ('+mine.length+')</h3>'+(mine.length?mine.map(card).join(''):'<div class="card mu">Abhi koi idea post nahi kiya.</div>')+
  '<button class="btn alt" id="lo">Log out</button></div>');
  bindCards($('app'));
  Array.prototype.forEach.call(document.querySelectorAll('[data-ap]'),function(b){b.onclick=function(){var up={};up['approved/'+b.dataset.ap]=true;up['pending/'+b.dataset.ap]=null;db.ref().update(up).then(function(){toast('Approve ho gaya')}).catch(function(e){toast(emsg(e))})}});
  function respond(mid,status){
    var m=S.inbox[mid],inp=document.querySelector('[data-rp="'+mid+'"]'),rep=inp?inp.value.trim():'',up={};
    up['inbox/'+uid+'/'+mid+'/status']=status;up['outbox/'+m.from+'/'+mid+'/status']=status;
    if(rep){up['inbox/'+uid+'/'+mid+'/reply']=rep;up['outbox/'+m.from+'/'+mid+'/reply']=rep}
    if(status==='approved')up['ideaAccess/'+m.ideaId+'/'+m.from]=true;
    db.ref().update(up).then(function(){toast(status==='approved'?'Approve ho gaya':'Decline ho gaya')}).catch(function(e){toast(emsg(e))});
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-ac]'),function(b){b.onclick=function(){respond(b.dataset.ac,'approved')}});
  Array.prototype.forEach.call(document.querySelectorAll('[data-dc]'),function(b){b.onclick=function(){respond(b.dataset.dc,'declined')}});
  $('lo').onclick=function(){if(confirm('Log out karna hai?'))auth.signOut()};
}
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
</script>
